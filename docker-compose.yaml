services:
  docktail:
    build: .
    command:
      - "--config=/docktail/config.json"
    volumes:
      - "./config.json:/docktail/config.json:ro"
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
    depends_on:
      - victorialogs
    ports:
      - "127.0.0.1:9898:9898"
    restart: always

  victorialogs:
    restart: always
    container_name: victorialogs
    image: victoriametrics/victoria-logs:v1.4.0-victorialogs
    command:
      - "--storageDataPath=/vlogs"
      - "--httpListenAddr=:9428"
      - "--retentionPeriod=4w"
    volumes:
      - victorialogs:/vlogs
    ports:
      - "127.0.0.1:9428:9428"

volumes:
  victorialogs: {}
